name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Mika APK
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-33" "build-tools;34.0.0" >/dev/null
          BT="$ANDROID_HOME/build-tools/34.0.0"
          AJ="$ANDROID_HOME/platforms/android-33/android.jar"
          APP=$(dirname "$(find . -name AndroidManifest.xml -not -path './.git/*' | head -1)")
          cd "$APP"
          rm -rf build && mkdir -p build/gen build/classes build/dex
          "$BT/aapt" package -f -m -J build/gen -M AndroidManifest.xml -S res -A assets -I "$AJ" -F build/res.apk
          javac --release 8 -Xlint:-options -cp "$AJ" -d build/classes $(find src build/gen -name '*.java')
          "$BT/d8" --release --min-api 23 --lib "$AJ" --output build/dex $(find build/classes -name '*.class')
          cp build/res.apk build/raw.apk
          cp build/dex/classes.dex build/classes.dex
          ( cd build && "$BT/aapt" add raw.apk classes.dex >/dev/null )
          "$BT/zipalign" -f -p 4 build/raw.apk build/aligned.apk
          keytool -genkeypair -keystore build/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          "$BT/apksigner" sign --ks build/debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out build/Mika-Launcher.apk build/aligned.apk
          echo "APK_PATH=$PWD/build/Mika-Launcher.apk" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: Mika-Launcher-apk
          path: ${{ env.APK_PATH }}
